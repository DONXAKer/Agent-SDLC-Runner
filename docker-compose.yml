# Agent-SDLC Runner: один контейнер, всё изменяемое состояние — в томах.
#
# Значения путей берутся из `.env` рядом (см. `.env.example`): они разные на каждой машине,
# и зашивать их в файл, который лежит в git, значило бы, что первый же `git pull` ломает
# чужую установку.

services:
  runner:
    build: .
    image: agent-sdlc-runner:local
    container_name: agent-sdlc-runner

    # Автостарт после перезагрузки. `unless-stopped`, а не `always`: контейнер,
    # остановленный человеком вручную, не должен подниматься сам — иначе «выключить на
    # время» становится невозможно.
    #
    # ВАЖНО: сама по себе эта строка перезагрузку НЕ переживает. Её отрабатывает демон,
    # поэтому демон обязан стартовать при загрузке — и это не теория: на этой машине
    # (OrbStack) автостарт был выключен, то есть после перезагрузки не поднялось бы ничего
    # ни при какой политике. Проверяется и включается так:
    #
    #     OrbStack:        orb config show | grep start_at_login
    #                      orb config set app.start_at_login true
    #     Docker Desktop:  Settings → General → «Start Docker Desktop when you sign in»
    #     Linux/systemd:   sudo systemctl enable docker
    #
    # Оговорка про `docker kill`: убитый им контейнер Docker считает остановленным вручную
    # и обратно не поднимает. Это не поломка политики — проверять надо падением процесса
    # внутри (`docker compose exec runner kill -9 1`) либо перезапуском демона.
    restart: unless-stopped

    # Обязателен, и по двум причинам сразу.
    #
    # Сигналы: PID 1 в Linux игнорирует SIGTERM без явного обработчика, поэтому без init
    # `docker stop` ждал полные 10 секунд и добивал процесс SIGKILL'ом — замерено, 10.2 с
    # против 0.13 с. Убийство на полпути означает оборванный этап и недописанный артефакт.
    #
    # Зомби: рантайм постоянно порождает потомков — гейты запускают команды сборки, тестов
    # и линтера, флоу `sdk` поднимает свой процесс. Без сборщика PID 1 они копятся в
    # таблице процессов на всё время жизни контейнера.
    init: true

    # Порт публикуется ТОЛЬКО на петлю хоста. У сервиса нет аутентификации: он поднимается
    # рядом с проектом, а не в сети. `8030:8030` без адреса открыл бы правку файлов и
    # запуск команд оболочки всем, кто видит машину.
    ports:
      - '127.0.0.1:${SDLC_PORT:-8030}:8030'

    environment:
      # Внутри контейнера слушаем все интерфейсы: петля отсюда наружу не видна, а границей
      # служит публикация порта выше.
      SDLC_HOST: '0.0.0.0'
      # Дерево, в пределах которого работает обзор каталогов и добавление проекта. Не
      # задано — обе ручки выключены целиком, а не открыты на весь контейнер.
      SDLC_BROWSE_ROOT: /projects
      SDLC_CONFIG_DIR: /config
      # Эталон методологии и скиллы: пути внутри контейнера, а не с хоста. Конфиг на диске
      # трогать не надо — эти переменные его перекрывают.
      SDLC_SKILLS_DIR: /claude/skills
      SDLC_AGENTS_DIR: /claude/agents
      SDLC_METHODOLOGY_DIR: /methodology

    volumes:
      # Целевые проекты. Артефакты витка пишутся в `.sdlc/<slug>/` ВНУТРИ проекта, поэтому
      # том обязан быть на запись: состояние витка живёт на диске проекта, не в контейнере.
      - '${SDLC_PROJECTS_DIR}:/projects'

      # Конфигурация раннера, моделей и проектов. На запись: добавление проекта из
      # интерфейса пишет `config/projects/*.json`.
      - './config:/config'

      # Эталон методологии — формы артефактов и тексты этапов. Только на чтение: их читают,
      # но не правят, и политика объявляет этот каталог read-only.
      - '${SDLC_METHODOLOGY_DIR}:/methodology:ro'

      # Скиллы и субагенты Claude Code, плюс учётные данные Max-подписки для флоу `sdk`.
      #
      # На ЗАПИСЬ, и это осознанная уступка: SDK ведёт в этом каталоге своё состояние
      # сессии, и с `:ro` флоу `sdk` не поднимется. Следствие честно: учётные данные Claude
      # оказываются внутри контейнера. Кому нужен только флоу `loop` — эту строку надо
      # закомментировать, тогда `sdk` перестанет работать, а больше ничего не изменится.
      - '${SDLC_CLAUDE_DIR}:/claude'

    # Локальные модели (Ollama, vLLM, LM Studio) слушают на ХОСТЕ, а `localhost` внутри
    # контейнера — это сам контейнер. Без этой записи флоу `loop` упирается в ECONNREFUSED,
    # и выглядит это как «модель не отвечает», а не как «мы стучимся не туда».
    # В `config/models.json` baseUrl тогда пишется как `http://host.docker.internal:11434`.
    #
    # На macOS и Windows Docker Desktop даёт это имя сам; строка нужна для Linux.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
